# Default experiment configuration.
# Copy to <name>.local.yaml for machine-specific overrides (git-ignored).
# Relative paths are resolved from the repository root.

ollama:
  host: http://127.0.0.1:11434   # overridden by the OLLAMA_HOST environment variable if set
  num_gpu: 0                     # CPU-only: applied to every Ollama call (embeddings and generation)

ingest:
  source_dir: data/raw
  chunk_size: 600                # characters (~160-200 tokens), under all-minilm's 256-token num_ctx
  chunk_overlap: 80             # characters shared between neighbouring chunks
  embedding_model: all-minilm    # all-MiniLM-L6-v2, served by Ollama
  batch_size: 32                 # chunks embedded per request, keeps CPU/RAM use steady

vector_store:
  persist_dir: chroma_db
  collection: documents

retrieval:
  top_k: 4

generation:
  model: llama3.2:3b             # Ollama model tag
  num_ctx: 4096                  # context window, the same for every model
  temperature: 0.0               # deterministic output for reproducible benchmarks
  seed: 42

benchmark:
  repeats: 5
  output_dir: results